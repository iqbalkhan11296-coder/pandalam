<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Sales Tracking</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=1"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#160005;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#4b001f;
    padding:20px;
    text-align:center;
    border-bottom:1px solid #d6a84f;
}

header h1{
    margin:0;
    color:#f5d27a;
    font-family:Georgia,serif;
    letter-spacing:3px;
}

header p{
    margin:6px 0 0;
    color:#d9bd78;
    font-size:12px;
    letter-spacing:2px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:18px;
}

.filters{
    background:#29000e;
    border:1px solid #9d7629;
    border-radius:10px;
    padding:14px;
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:10px;
    margin-bottom:18px;
}

.filters label{
    color:#d9bd78;
    font-size:12px;
    display:block;
    margin-bottom:5px;
}

.filters input{
    width:100%;
    padding:10px;
    border-radius:6px;
    border:1px solid #8c6a2d;
}

.load-btn{
    align-self:end;
    padding:10px 20px;
    background:#d0a43d;
    border:none;
    border-radius:6px;
    font-weight:bold;
    color:#25000c;
}

.cards{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(190px,1fr));
    gap:12px;
    margin-bottom:25px;
}

.card{
    background:linear-gradient(145deg,#310011,#180006);
    border:1px solid #9d7629;
    border-radius:12px;
    padding:18px;
}

.card-title{
    color:#c9ad70;
    font-size:13px;
}

.card-value{
    color:#f5d27a;
    font-size:28px;
    font-weight:bold;
    margin-top:8px;
}

.section-title{
    color:#f5d27a;
    font-family:Georgia,serif;
    font-size:22px;
    margin:25px 0 12px;
}

.panel{
    background:#f8f4ea;
    color:#222;
    border-radius:10px;
    overflow:hidden;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#4b001f;
    color:#f5d27a;
    padding:12px;
    text-align:left;
}

td{
    padding:11px;
    border-bottom:1px solid #ddd;
}

.error{
    background:#5b0015;
    border:1px solid #ff7777;
    padding:12px;
    border-radius:7px;
    display:none;
    margin-bottom:15px;
}

.empty{
    text-align:center;
    padding:25px;
    color:#777;
}

@media(max-width:650px){

    .filters{
        grid-template-columns:1fr;
    }

    .load-btn{
        width:100%;
    }

    .panel{
        overflow-x:auto;
    }

    table{
        min-width:650px;
    }

}

</style>

</head>

<body>

<header>

<h1>CHAATARRA</h1>

<p>SALES TRACKING</p>

</header>


<div class="container">

<div id="errorBox"
class="error">
</div>


<div class="filters">

<div>

<label>FROM</label>

<input
type="date"
id="fromDate">

</div>


<div>

<label>TO</label>

<input
type="date"
id="toDate">

</div>


<button
class="load-btn"
onclick="loadSales()">

VIEW SALES

</button>

</div>


<div class="cards">

<div class="card">

<div class="card-title">
TOTAL SALES
</div>

<div class="card-value"
id="totalSales">
₹0
</div>

</div>


<div class="card">

<div class="card-title">
TOTAL ORDERS
</div>

<div class="card-value"
id="totalOrders">
0
</div>

</div>


<div class="card">

<div class="card-title">
TOTAL ITEMS SOLD
</div>

<div class="card-value"
id="totalItems">
0
</div>

</div>


<div class="card">

<div class="card-title">
AVERAGE BILL
</div>

<div class="card-value"
id="averageBill">
₹0
</div>

</div>

</div>


<div class="section-title">
PAYMENT BREAKDOWN
</div>

<div class="cards">

<div class="card">

<div class="card-title">
CASH
</div>

<div class="card-value"
id="cashSales">
₹0
</div>

</div>


<div class="card">

<div class="card-title">
UPI
</div>

<div class="card-value"
id="upiSales">
₹0
</div>

</div>


<div class="card">

<div class="card-title">
CARD
</div>

<div class="card-value"
id="cardSales">
₹0
</div>

</div>

</div>


<div class="section-title">
ITEM SALES
</div>

<div class="panel">

<table>

<thead>

<tr>

<th>Item</th>

<th>Quantity</th>

<th>Revenue</th>

</tr>

</thead>

<tbody id="itemTable">

<tr>

<td colspan="3"
class="empty">

Loading...

</td>

</tr>

</tbody>

</table>

</div>


<div class="section-title">
ORDERS
</div>

<div class="panel">

<table>

<thead>

<tr>

<th>Order</th>

<th>Date</th>

<th>Customer</th>

<th>Payment</th>

<th>Total</th>

</tr>

</thead>

<tbody id="orderTable">

<tr>

<td colspan="5"
class="empty">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>


<script>


function localDateString(date){

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth()+1
        ).padStart(2,"0");

    const day =
        String(
            date.getDate()
        ).padStart(2,"0");

    return `${year}-${month}-${day}`;

}


function setDefaultDates(){

    const today =
        new Date();

    document.getElementById(
        "fromDate"
    ).value =
        localDateString(today);

    document.getElementById(
        "toDate"
    ).value =
        localDateString(today);

}


async function loadSales(){

    document.getElementById(
        "errorBox"
    ).style.display="none";


    const from =
        document.getElementById(
            "fromDate"
        ).value;


    const to =
        document.getElementById(
            "toDate"
        ).value;


    if(!from || !to){

        showError(
            "Please select both dates."
        );

        return;

    }


    if(from > to){

        showError(
            "From date cannot be after To date."
        );

        return;

    }


    const start =
        new Date(
            from+"T00:00:00"
        ).toISOString();


    const endDate =
        new Date(
            to+"T00:00:00"
        );

    endDate.setDate(
        endDate.getDate()+1
    );


    const end =
        endDate.toISOString();


    const {
        data,
        error
    } =
    await supabaseClient
        .from("chaat_orders")
        .select("*")
        .gte(
            "created_at",
            start
        )
        .lt(
            "created_at",
            end
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        showError(
            error.message
        );

        return;

    }


    calculateSales(
        data || []
    );

}


function calculateSales(orders){

    let totalSales=0;

    let totalItems=0;

    let cash=0;

    let upi=0;

    let card=0;


    const itemSales={};


    orders.forEach(order=>{

        const total =
            Number(order.total || 0);

        totalSales += total;


        if(order.payment_method==="Cash"){
            cash += total;
        }

        if(order.payment_method==="UPI"){
            upi += total;
        }

        if(order.payment_method==="Card"){
            card += total;
        }


        if(Array.isArray(order.items)){

            order.items.forEach(item=>{

                const qty =
                    Number(item.qty || 0);

                const price =
                    Number(item.price || 0);

                totalItems += qty;


                if(!itemSales[item.name]){

                    itemSales[item.name]={
                        qty:0,
                        revenue:0
                    };

                }


                itemSales[item.name].qty
                    += qty;

                itemSales[item.name].revenue
                    += qty * price;

            });

        }

    });


    const average =
        orders.length
        ? totalSales / orders.length
        : 0;


    document.getElementById(
        "totalSales"
    ).textContent =
        "₹"+formatMoney(totalSales);


    document.getElementById(
        "totalOrders"
    ).textContent =
        orders.length;


    document.getElementById(
        "totalItems"
    ).textContent =
        totalItems;


    document.getElementById(
        "averageBill"
    ).textContent =
        "₹"+formatMoney(average);


    document.getElementById(
        "cashSales"
    ).textContent =
        "₹"+formatMoney(cash);


    document.getElementById(
        "upiSales"
    ).textContent =
        "₹"+formatMoney(upi);


    document.getElementById(
        "cardSales"
    ).textContent =
        "₹"+formatMoney(card);


    displayItems(
        itemSales
    );


    displayOrders(
        orders
    );

}


function displayItems(itemSales){

    const tbody =
        document.getElementById(
            "itemTable"
        );


    const names =
        Object.keys(itemSales)
        .sort(
            (a,b)=>
                itemSales[b].revenue
                -
                itemSales[a].revenue
        );


    if(names.length===0){

        tbody.innerHTML=`

            <tr>

                <td
                colspan="3"
                class="empty">

                    No item sales

                </td>

            </tr>

        `;

        return;

    }


    tbody.innerHTML =
        names.map(name=>{

            const item =
                itemSales[name];

            return `

                <tr>

                    <td>
                        ${escapeHtml(name)}
                    </td>

                    <td>
                        ${item.qty}
                    </td>

                    <td>
                        ₹${formatMoney(
                            item.revenue
                        )}
                    </td>

                </tr>

            `;

        }).join("");

}


function displayOrders(orders){

    const tbody =
        document.getElementById(
            "orderTable"
        );


    if(orders.length===0){

        tbody.innerHTML=`

            <tr>

                <td
                colspan="5"
                class="empty">

                    No orders found

                </td>

            </tr>

        `;

        return;

    }


    tbody.innerHTML =
        orders.map(order=>{

            const date =
                new Date(
                    order.created_at
                )
                .toLocaleString(
                    "en-IN"
                );


            return `

                <tr>

                    <td>
                        #${order.order_number}
                    </td>

                    <td>
                        ${date}
                    </td>

                    <td>
                        ${escapeHtml(
                            order.customer_name ||
                            "Walk-in Customer"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            order.payment_method ||
                            "-"
                        )}
                    </td>

                    <td>
                        ₹${formatMoney(
                            Number(
                                order.total || 0
                            )
                        )}
                    </td>

                </tr>

            `;

        }).join("");

}


function formatMoney(number){

    return Number(number)
        .toFixed(2)
        .replace(
            /\.00$/,
            ""
        );

}


function showError(message){

    const box =
        document.getElementById(
            "errorBox"
        );

    box.textContent =
        "Error: "+message;

    box.style.display="block";

}


function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


setDefaultDates();

loadSales();

</script>

</body>

</html>
