<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Chaatarra Billing</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js?v=1"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #160005;
            color: #fff;
        }

        header {
            background: #4b001f;
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #d6a84f;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        header h1 {
            margin: 0;
            color: #f5d27a;
            font-family: Georgia, serif;
            font-size: 28px;
            letter-spacing: 3px;
        }

        header p {
            margin: 4px 0 0;
            color: #d9bd78;
            font-size: 11px;
            letter-spacing: 3px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            min-height: calc(100vh - 75px);
        }

        .menu-area {
            padding: 15px;
            overflow-y: auto;
        }

        .category-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .category-btn {
            border: 1px solid #c99b3b;
            background: #29000e;
            color: #f5d27a;
            padding: 15px 5px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .category-btn.active {
            background: #d0a43d;
            color: #25000c;
        }

        .section-title {
            color: #f5d27a;
            font-family: Georgia, serif;
            font-size: 23px;
            text-align: center;
            margin: 10px 0 15px;
            letter-spacing: 2px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 10px;
        }

        .product {
            min-height: 105px;
            background: linear-gradient(145deg, #310011, #180006);
            border: 1px solid #9d7629;
            border-radius: 12px;
            padding: 12px 8px;
            color: white;
            cursor: pointer;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: .15s;
        }

        .product:active {
            transform: scale(.96);
        }

        .product-name {
            font-size: 15px;
            line-height: 1.3;
            font-weight: bold;
        }

        .product-price {
            color: #f5d27a;
            font-size: 18px;
            margin-top: 8px;
            font-weight: bold;
        }

        /* BILL */

        .bill-area {
            background: #f8f4ea;
            color: #222;
            border-left: 1px solid #b68b36;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 75px);
            position: sticky;
            top: 75px;
        }

        .bill-header {
            background: #4b001f;
            color: #f5d27a;
            padding: 14px;
            text-align: center;
        }

        .bill-header h2 {
            margin: 0;
            font-family: Georgia, serif;
        }

        .customer-section {
            padding: 10px;
            background: #eee8d8;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .customer-section input,
        .customer-section select {
            width: 100%;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }

        .customer-section .full {
            grid-column: 1 / -1;
        }

        .cart {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 50px 10px;
        }

        .cart-item {
            border-bottom: 1px solid #ddd;
            padding: 9px 0;
        }

        .cart-top {
            display: flex;
            justify-content: space-between;
            gap: 5px;
        }

        .cart-name {
            font-weight: bold;
            font-size: 14px;
        }

        .cart-price {
            font-weight: bold;
        }

        .cart-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 7px;
        }

        .qty {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty button {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 5px;
            background: #4b001f;
            color: white;
            font-size: 18px;
        }

        .remove {
            border: none;
            background: none;
            color: #a00000;
            font-size: 12px;
        }

        .bill-bottom {
            border-top: 2px solid #4b001f;
            background: white;
            padding: 12px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: bold;
            color: #4b001f;
            margin-bottom: 10px;
        }

        .payment {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .payment button {
            padding: 10px 4px;
            border: 1px solid #aaa;
            background: white;
            border-radius: 6px;
            font-weight: bold;
        }

        .payment button.active {
            background: #4b001f;
            color: #f5d27a;
            border-color: #4b001f;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .action-buttons button {
            border: none;
            padding: 14px 5px;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
        }

        .clear-btn {
            background: #ddd;
            color: #333;
        }

        .bill-btn {
            background: #4b001f;
            color: #f5d27a;
        }

        button {
            touch-action: manipulation;
        }

        /* PRINT */

        #printArea {
            display: none;
        }

        @media (max-width: 850px) {

            .layout {
                display: block;
            }

            .menu-area {
                padding-bottom: 390px;
            }

            .bill-area {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                top: auto;
                height: 370px;
                z-index: 30;
                border-top: 2px solid #b68b36;
                border-left: none;
            }

            .bill-header {
                padding: 7px;
            }

            .bill-header h2 {
                font-size: 18px;
            }

            .customer-section {
                padding: 6px;
            }

            .customer-section input {
                padding: 8px;
            }

            .cart {
                padding: 6px 10px;
            }

            .bill-bottom {
                padding: 7px 10px;
            }

            .total-row {
                font-size: 20px;
                margin-bottom: 5px;
            }

            .products {
                grid-template-columns: repeat(2, 1fr);
            }

            .product {
                min-height: 90px;
            }
        }

        @media print {

            body * {
                visibility: hidden !important;
            }

            #printArea,
            #printArea * {
                visibility: visible !important;
            }

            #printArea {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 58mm;
                padding: 2mm;
                background: white;
                color: black;
                font-family: monospace;
                font-size: 11px;
            }

            @page {
                size: 58mm auto;
                margin: 0;
            }
        }
    </style>
</head>

<body>

    <div class="layout">

        <section class="menu-area">

        <!-- BILL -->

        <aside class="bill-area">

            </div>

            <div class="customer-section">

                <input
                    id="customerName"

                    placeholder="Customer Name">

                <input
                    id="tableNumber"
                    type="text"
                    placeholder="Table / Token No.">

                <input
                    id="phone"
                    type="tel"
                    placeholder="Phone (optional)">

            </div>

            <div id="cart" class="cart">

                <div class="empty">
                    No items added
                </div>

            </div>

            <div class="bill-bottom">

                <div class="total-row">
                    <span>TOTAL</span>
                    <span id="total">₹0</span>
                </div>

                <div class="payment">

                    <button
                        class="payment-btn active"
                        onclick="selectPayment('Cash', this)">
                        CASH
                    </button>

                    <button
                        class="payment-btn"
                        onclick="selectPayment('UPI', this)">
                        UPI
                    </button>

                    <button
                        class="payment-btn"
                        onclick="selectPayment('Card', this)">
                        CARD
                    </button>

                </div>

                <div class="action-buttons">

                    <button
                        class="clear-btn"
                        onclick="clearCart()">
                        CLEAR
                    </button>

                    <button
                        class="bill-btn"
                        onclick="placeOrder()">
                        BILL & PRINT
                    </button>

                </div>

            </div>

        </aside>

    </div>

        function showCategory(category, button) {

            currentCategory = category;

            document
                .querySelectorAll(".category-btn")
                .forEach(btn => btn.classList.remove("active"));

            button.classList.add("active");

            renderMenu(category);

        }


        /* =========================
           RENDER MENU
        ========================= */

        function renderMenu(category) {

            const container =
                document.getElementById("menuContainer");

            const title =
                category === "chaat"
                    ? "CHAAT"
                    : category === "drinks"
                        ? "DRINKS"
                        : "COMBOS";

            container.innerHTML = `
                <div class="section-title">
                    ${title}
                </div>

                <div class="products">

                    ${menu[category].map((item, index) => `

                        <button
                            class="product"
                            onclick="addToCart('${category}', ${index})">

                            <div class="product-name">
                                ${item.name}
                            </div>

                            <div class="product-price">
                                ₹${item.price}
                            </div>

                        </button>

                    `).join("")}

                </div>
            `;

        }


        /* =========================
           ADD TO CART
        ========================= */

        function addToCart(category, index) {

            const item = menu[category][index];

            const existing =
                cart.find(
                    x => x.name === item.name
                );

            if (existing) {

                existing.qty++;

            } else {

                cart.push({
                    name: item.name,
                    price: item.price,
                    qty: 1
                });

            }

            renderCart();

        }


        /* =========================
           CHANGE QUANTITY
        ========================= */

        function changeQty(index, amount) {

            cart[index].qty += amount;

            if (cart[index].qty <= 0) {

                cart.splice(index, 1);

            }

            renderCart();

        }


        /* =========================
           REMOVE ITEM
        ========================= */

        function removeItem(index) {

            cart.splice(index, 1);

            renderCart();
