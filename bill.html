
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaatarra | Billing</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=1"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#160005;color:white;font-family:Arial,sans-serif;padding-bottom:24px}
header{background:#4b001f;padding:18px;text-align:center;border-bottom:1px solid #d6a84f}
header h1{margin:0;color:#f5d27a;font-family:Georgia,serif;letter-spacing:3px}
header p{margin:5px 0 0;color:#d9bd78;font-size:11px;letter-spacing:2px}
.container{max-width:1200px;margin:auto;padding:15px}
.categories{display:flex;gap:8px;overflow-x:auto;margin-bottom:15px}
.category-btn{flex:1;min-width:100px;padding:15px;border:1px solid #9d7629;background:#29000e;color:#f5d27a;border-radius:8px;font-weight:bold;cursor:pointer}
.category-btn.active{background:#f5d27a;color:#4b001f}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.product{background:linear-gradient(145deg,#310011,#180006);border:1px solid #76551d;border-radius:12px;padding:15px;min-height:155px}
.product-name{font-weight:bold;min-height:35px;font-size:16px;line-height:1.2}
.product-price{color:#f5d27a;font-size:17px;font-weight:800;margin:8px 0}
.product.unavailable{opacity:.72;border-color:#777}
.unavailable-badge{display:inline-block;background:#8b0000;color:white;padding:5px 8px;border-radius:5px;font-size:11px;font-weight:bold;margin:4px 0 8px}
.add-btn{width:100%;min-height:44px;border:none;background:#f5d27a;color:#4b001f;padding:10px 14px;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;touch-action:manipulation}
.empty{text-align:center;padding:30px 10px;color:#c9ad70}
.cart{position:fixed;left:50%;bottom:14px;transform:translate(-50%,calc(100% + 30px));width:min(680px,calc(100% - 24px));max-height:min(78vh,680px);overflow:hidden;z-index:1000;background:rgba(248,244,234,.98);color:#222;border-radius:22px;padding:0;border:1px solid rgba(245,210,122,.65);box-shadow:0 18px 60px #0007;opacity:0;transition:transform .35s ease,opacity .25s ease}
.cart.cart-visible{transform:translate(-50%,0);opacity:1}
.cart-drawer-head{min-height:72px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;background:linear-gradient(135deg,#fff,#f6edd3);border-bottom:1px solid #eee}
.cart-icon{width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;border-radius:15px;background:#4b001f;color:#f5d27a;font-size:22px}
.cart-head-info{min-width:0;flex:1}
.cart-head-title{display:flex;align-items:center;gap:8px;font-weight:900;color:#4b001f;font-size:15px}
.cart-count{display:inline-grid;place-items:center;min-width:23px;height:23px;padding:0 7px;border-radius:99px;background:#f5d27a;color:#4b001f;font-size:13px;font-weight:900}
.cart-preview{margin-top:3px;color:#786a55;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-head-total{text-align:right;color:#4b001f;font-size:19px;font-weight:900;white-space:nowrap}
.cart-chevron{color:#4b001f;font-size:18px;transition:transform .2s}
.cart.expanded .cart-chevron{transform:rotate(180deg)}
.cart-body{max-height:0;overflow-y:auto;overflow-x:hidden;transition:max-height .3s ease}
.cart.expanded .cart-body{max-height:calc(min(78vh,680px) - 72px)}
.cart-inner{padding:14px}
.cart-item{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #e6dfd1;background:#fffdf8;border-radius:13px;padding:12px;margin-bottom:8px}
.qty{display:flex;align-items:center;gap:8px;flex-shrink:0}
.qty button{width:30px;height:30px;border:none;background:#4b001f;color:#f5d27a;border-radius:6px;font-weight:bold}
.remove{border:none;background:#8b0000;color:white;padding:6px 9px;border-radius:5px}
.customer{margin-top:10px;padding-top:4px}
.customer input{width:100%;padding:11px;margin-bottom:8px;border:1px solid #aaa;border-radius:6px;font-size:15px}
.payment{display:flex;gap:8px;margin-top:8px}
.payment button{flex:1;padding:11px;border:1px solid #777;background:white;border-radius:6px;font-weight:bold}
.payment button.selected{background:#4b001f;color:#f5d27a;border-color:#4b001f}
.total{display:flex;justify-content:space-between;font-size:22px;font-weight:bold;color:#4b001f;margin-top:15px}
.actions{display:flex;gap:7px;margin-top:15px}
.actions button{flex:1;min-width:0;min-height:44px;padding:8px 5px;border:none;border-radius:7px;font-weight:bold;font-size:12px;cursor:pointer}
.clear{background:#777;color:white}
.bill{background:#4b001f;color:#f5d27a}
.right{background:#4b001f;color:#f5d27a}
.hold-order-btn{background:#f5d27a;color:#4b001f;border:1px solid #9d7629!important}
.held-orders-button{position:fixed;right:12px;bottom:12px;z-index:1100;padding:13px 15px;background:#4b001f;color:#f5d27a;border:1px solid #f5d27a;border-radius:14px;font-weight:bold;box-shadow:0 5px 20px #0006;cursor:pointer}
.held-orders-panel{position:fixed;right:12px;bottom:70px;z-index:1101;width:min(370px,calc(100% - 24px));max-height:65vh;overflow-y:auto;padding:14px;background:#fffdf8;color:#4b001f;border:1px solid #d6a84f;border-radius:14px;box-shadow:0 8px 30px #0007}
.held-orders-heading{display:flex;justify-content:space-between;align-items:center;gap:8px}
.held-orders-heading button,.held-order-actions button{padding:9px 12px;background:#4b001f;color:#f5d27a;border:none;border-radius:7px;font-weight:bold;cursor:pointer}
.held-order-card{margin-top:12px;padding:12px;border:1px solid #e6dfd1;border-radius:10px;overflow-wrap:anywhere}
.held-order-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.held-order-actions .delete-held{background:#8b0000;color:white}
[hidden]{display:none!important}
.receipt-print{display:none}
.receipt-center{text-align:center}
.receipt-total{font-size:18px;font-weight:bold}
@media(max-width:600px){
 .products{grid-template-columns:repeat(2,minmax(0,1fr))}
 .product{padding:13px}
 .cart{bottom:10px;width:calc(100% - 16px);border-radius:19px;max-height:82vh}
 .cart-drawer-head{min-height:68px;padding:10px 11px}
 .cart-icon{width:42px;height:42px;flex-basis:42px}
 .cart-head-total{font-size:17px}
 .cart.expanded .cart-body{max-height:calc(82vh - 68px)}
 .actions{gap:5px}
 .actions button{font-size:11px;padding:8px 3px}
 .product-name{font-size:15px}
}
@media print{
 body{background:white;color:black;padding:0;margin:0}
 body>*:not(#receipt){display:none!important}
 #receipt{display:block!important;width:58mm;padding:3mm;font-family:monospace;font-size:13px;color:#000;background:#fff}
 #receipt hr{border:0;border-top:1px dashed #000;margin:7px 0}
}
</style>
</head>

<body>
<header>
    <h1>CHAATARRA</h1>
    <p>THE HOUSE OF CHAATS</p>
</header>

<div class="container">
    <div class="categories">
        <button class="category-btn active" onclick="showCategory('Chaat',this)">CHAAT</button>
        <button class="category-btn" onclick="showCategory('Drinks',this)">DRINKS</button>
        <button class="category-btn" onclick="showCategory('Combos',this)">COMBOS</button>
    </div>

    <div id="products" class="products">
        <div class="empty">Loading products...</div>
    </div>
</div>

<!-- CART DRAWER -->
<div class="cart" id="cartDrawer">
    <div class="cart-drawer-head" id="cartDrawerHead"
         onclick="toggleCartDrawer()" role="button" tabindex="0"
         aria-label="Expand or collapse cart">
        <div class="cart-icon">🛒</div>
        <div class="cart-head-info">
            <div class="cart-head-title">
                <span>YOUR ORDER</span>
                <span class="cart-count" id="cartCount">0</span>
            </div>
            <div class="cart-preview" id="cartPreview">Add items to start an order</div>
        </div>
        <div class="cart-head-total" id="cartHeadTotal">₹0</div>
        <div class="cart-chevron">⌃</div>
    </div>

    <div class="cart-body">
        <div class="cart-inner">
            <div id="cartItems"><div class="empty">Cart is empty</div></div>

            <div class="customer">
                <input id="customerName" type="text" placeholder="Customer Name">
                <input id="tableNumber" type="text" placeholder="Table / Token Number">
                <input id="phone" type="tel" placeholder="Phone Number">
                <input id="notes" type="text" placeholder="Special Instructions">
            </div>

            <div class="payment">
                <button id="cashBtn" onclick="selectPayment('Cash')">CASH</button>
                <button id="upiBtn" onclick="selectPayment('UPI')">UPI</button>
                <button id="cardBtn" onclick="selectPayment('Card')">CARD</button>
            </div>

            <div class="total">
                <span>TOTAL</span>
                <span id="total">₹0</span>
            </div>

            <div class="actions">
                <button class="clear" onclick="clearCart()">CLEAR</button>
                <button class="hold-order-btn" onclick="holdCurrentOrder()">⏸ HOLD</button>
                <button class="bill" onclick="billAndPrint()">BILL &amp; PRINT</button>
                <button class="right" onclick="window.location.href='https://iqbalkhan11296-coder.github.io/pandalam/upi.html'">QR</button>
            </div>
        </div>
    </div>
</div>

<!-- HELD ORDERS BUTTON AND PANEL -->
<button id="heldOrdersButton" class="held-orders-button"
        type="button" onclick="toggleHeldOrdersPanel()" hidden>
    📋 HELD (0)
</button>

<div id="heldOrdersPanel" class="held-orders-panel" hidden>
    <div class="held-orders-heading">
        <strong>HELD ORDERS</strong>
        <button type="button" onclick="toggleHeldOrdersPanel()">CLOSE</button>
    </div>
    <div id="heldOrdersList"></div>
</div>

<!-- PRINT RECEIPT -->
<div id="receipt" class="receipt-print">
    <div class="receipt-center">
        <strong>CHAATARRA</strong><br>
        THE HOUSE OF CHAATS
    </div>
    <hr>
    <div>Order No: <span id="receiptOrder"></span></div>
    <div>Date: <span id="receiptDate"></span></div>
    <div>Customer: <span id="receiptCustomer"></span></div>
    <div>Table/Token: <span id="receiptTable"></span></div>
    <div id="receiptPhoneRow">Phone: <span id="receiptPhone"></span></div>
    <hr>
    <div id="receiptItems"></div>
    <hr>
    <div class="receipt-total">TOTAL: ₹<span id="receiptTotal">0</span></div>
    <div>Payment: <span id="receiptPayment"></span></div>
    <br>
    <div class="receipt-center">Thank You!<br>Visit Again</div>
</div>

<script>
"use strict";

let allProducts = [];
let currentCategory = "Chaat";
let cart = [];
let selectedPayment = "Cash";
let currentOrderNumber = null;
let cartDrawerExpanded = false;

/* HELD ORDERS: SAVED IN THIS BROWSER */
const HELD_ORDERS_KEY = "chaatarra_held_orders_v1";
let heldOrders = [];
let currentHeldOrderId = null;
let heldOrdersPanelOpen = false;

/* SAFE HTML */
function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* PRODUCT LOADING */
async function loadProducts() {
    const productsBox = document.getElementById("products");
    productsBox.innerHTML = '<div class="empty">Loading products...</div>';

    try {
        const { data, error } = await supabaseClient
            .from("chaat_products")
            .select("*")
            .order("name", { ascending: true });

        if (error) throw error;

        allProducts = data || [];
        const activeButton = document.querySelector(".category-btn.active");
        showCategory(currentCategory, activeButton);
    } catch (error) {
        console.error(error);
        productsBox.innerHTML =
            `<div class="empty">Unable to load products.<br><br>${escapeHtml(error.message)}</div>`;
    }
}

function subscribeToProductUpdates() {
    supabaseClient
        .channel("chaat-products-live")
        .on("postgres_changes", {
            event: "*",
            schema: "public",
            table: "chaat_products"
        }, () => loadProducts())
        .subscribe(status => console.log("Product realtime status:", status));
}

/* CATEGORY DISPLAY */
function showCategory(category, button) {
    currentCategory = category;

    document.querySelectorAll(".category-btn").forEach(btn => {
        btn.classList.remove("active");
    });
    if (button) button.classList.add("active");

    const productsBox = document.getElementById("products");
    const products = allProducts.filter(product =>
        String(product.category).toLowerCase() === category.toLowerCase()
    );

    if (!products.length) {
        productsBox.innerHTML =
            `<div class="empty">No products in ${escapeHtml(category)}.</div>`;
        return;
    }

    productsBox.innerHTML = products.map(product => {
        const available = product.available !== false;

        return `
            <div class="product ${available ? "" : "unavailable"}">
                <div class="product-name">${escapeHtml(product.name)}</div>
                ${available ? "" : '<div class="unavailable-badge">UNAVAILABLE</div>'}
                <div class="product-price">₹${Number(product.price).toFixed(0)}</div>
                ${available
                    ? `<button class="add-btn" onclick="addToCart(${Number(product.id)})">ADD</button>`
                    : '<button class="add-btn" disabled style="background:#555;color:#ddd">UNAVAILABLE</button>'
                }
            </div>`;
    }).join("");
}

/* CART DRAWER */
function toggleCartDrawer(force) {
    const drawer = document.getElementById("cartDrawer");
    if (!drawer || cart.length === 0) return;

    cartDrawerExpanded = typeof force === "boolean"
        ? force
        : !cartDrawerExpanded;

    drawer.classList.toggle("expanded", cartDrawerExpanded);
}

function showCartBarOnly() {
    const drawer = document.getElementById("cartDrawer");
    if (!drawer) return;

    drawer.classList.add("cart-visible");
    drawer.classList.remove("expanded");
    cartDrawerExpanded = false;
}

function showCartDrawer() {
    const drawer = document.getElementById("cartDrawer");
    if (!drawer) return;

    drawer.classList.add("cart-visible", "expanded");
    cartDrawerExpanded = true;
}

function hideCartDrawer() {
    const drawer = document.getElementById("cartDrawer");
    if (!drawer) return;

    drawer.classList.remove("expanded", "cart-visible");
    cartDrawerExpanded = false;
}

document.getElementById("cartDrawerHead").addEventListener("keydown", function(e) {
    if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toggleCartDrawer();
    }
});

function updateCartHeader() {
    const count = cart.reduce((sum, item) => sum + item.qty, 0);

    document.getElementById("cartCount").textContent = count;
    document.getElementById("cartHeadTotal").textContent = "₹" + getTotal().toFixed(0);

    document.getElementById("cartPreview").textContent = cart.length
        ? cart.map(item => item.qty > 1
            ? `${item.name} ×${item.qty}`
            : item.name
        ).join(" • ")
        : "Add items to start an order";
}

/* ADD ITEMS */
function addToCart(productId) {
    const product = allProducts.find(p => Number(p.id) === Number(productId));
    if (!product) return;

    if (product.available === false) {
        alert("This item is currently unavailable.");
        return;
    }

    const existing = cart.find(item => Number(item.id) === Number(product.id));

    if (existing) {
        existing.qty++;
    } else {
        cart.push({
            id: product.id,
            name: product.name,
            price: Number(product.price),
            category: product.category,
            qty: 1
        });
    }

    renderCart();
    showCartBarOnly();
}

/* RENDER CART */
function renderCart() {
    const cartBox = document.getElementById("cartItems");

    if (!cart.length) {
        cartBox.innerHTML = '<div class="empty">Cart is empty</div>';
        document.getElementById("total").textContent = "₹0";
        updateCartHeader();
        hideCartDrawer();
        return;
    }

    cartBox.innerHTML = cart.map((item, index) => `
        <div class="cart-item">
            <div>
                <strong>${escapeHtml(item.name)}</strong><br>
                ₹${Number(item.price).toFixed(0)} × ${item.qty}<br>
                <strong>₹${(item.price * item.qty).toFixed(0)}</strong>
            </div>
            <div class="qty">
                <button onclick="changeQty(${index},-1)">−</button>
                <span>${item.qty}</span>
                <button onclick="changeQty(${index},1)">+</button>
                <button class="remove" onclick="removeItem(${index})">×</button>
            </div>
        </div>
    `).join("");

    updateCartHeader();
    updateTotal();
}

function changeQty(index, change) {
    if (!cart[index]) return;

    cart[index].qty += change;
    if (cart[index].qty <= 0) cart.splice(index, 1);

    renderCart();
    if (cart.length) showCartBarOnly();
}

function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
    if (cart.length) showCartBarOnly();
}

function getTotal() {
    return cart.reduce((sum, item) => sum + item.price * item.qty, 0);
}

function updateTotal() {
    document.getElementById("total").textContent = "₹" + getTotal().toFixed(0);
}

/* PAYMENT */
function selectPayment(method) {
    selectedPayment = method;

    document.querySelectorAll(".payment button").forEach(button => {
        button.classList.remove("selected");
    });

    const ids = { Cash: "cashBtn", UPI: "upiBtn", Card: "cardBtn" };
    document.getElementById(ids[method]).classList.add("selected");
}

/* LOCAL STORAGE HELPERS */
function readHeldOrders() {
    try {
        const saved = localStorage.getItem(HELD_ORDERS_KEY);
        const parsed = saved ? JSON.parse(saved) : [];
        return Array.isArray(parsed) ? parsed : [];
    } catch (error) {
        console.error("Could not read held orders:", error);
        alert("Unable to read held orders from this browser.");
        return [];
    }
}

function saveHeldOrders() {
    try {
        localStorage.setItem(HELD_ORDERS_KEY, JSON.stringify(heldOrders));
        return true;
    } catch (error) {
        console.error("Could not save held orders:", error);
        alert("Could not save this order in browser storage. Your cart has not been cleared.");
        return false;
    }
}

function refreshHeldOrders() {
    const button = document.getElementById("heldOrdersButton");
    const list = document.getElementById("heldOrdersList");

    button.textContent = `📋 HELD (${heldOrders.length})`;
    button.hidden = heldOrders.length === 0;

    if (!heldOrders.length) {
        list.innerHTML = '<p>No held orders yet.</p>';
        document.getElementById("heldOrdersPanel").hidden = true;
        heldOrdersPanelOpen = false;
        return;
    }

    list.innerHTML = heldOrders.map(order => {
        const itemCount = (order.items || []).reduce(
            (sum, item) => sum + Number(item.qty || 0), 0
        );
        const isCurrent = order.id === currentHeldOrderId;

        return `
            <div class="held-order-card">
                <strong>Table / Token: ${escapeHtml(order.tableNumber || "Not entered")}</strong>
                <div style="margin-top:5px">${escapeHtml(order.customerName || "Walk-in Customer")}</div>
                <div style="margin-top:4px">${itemCount} items · ₹${Number(order.total || 0).toFixed(0)}</div>
                <div style="font-size:12px;margin-top:4px;color:#786a55">${escapeHtml(order.updatedAt || "")}</div>
                <div class="held-order-actions">
                    <button onclick="resumeHeldOrder('${order.id}')">${isCurrent ? "EDIT ORDER" : "RESUME"}</button>
                    <button class="delete-held" onclick="deleteHeldOrder('${order.id}')">DELETE</button>
                </div>
            </div>`;
    }).join("");
}

function toggleHeldOrdersPanel() {
    heldOrdersPanelOpen = !heldOrdersPanelOpen;
    document.getElementById("heldOrdersPanel").hidden = !heldOrdersPanelOpen;

    if (heldOrdersPanelOpen) {
        heldOrders = readHeldOrders();
        refreshHeldOrders();
        document.getElementById("heldOrdersPanel").hidden = false;
    }
}

/* HOLD CURRENT ORDER */
function holdCurrentOrder() {
    if (!cart.length) {
        alert("Please add items before holding an order.");
        return;
    }

    const order = {
        id: currentHeldOrderId || (
            "held_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8)
        ),
        customerName: document.getElementById("customerName").value.trim(),
        tableNumber: document.getElementById("tableNumber").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        notes: document.getElementById("notes").value.trim(),
        payment: selectedPayment,
        items: cart.map(item => ({ ...item })),
        total: getTotal(),
        updatedAt: new Date().toLocaleString()
    };

    const previousOrders = readHeldOrders();
    heldOrders = previousOrders;

    const index = heldOrders.findIndex(item => item.id === order.id);

    if (index >= 0) {
        heldOrders[index] = order;
    } else {
        heldOrders.unshift(order);
    }

    if (!saveHeldOrders()) {
        heldOrders = previousOrders;
        return;
    }

    currentHeldOrderId = null;
    cart = [];

    resetCustomerFields();
    renderCart();
    hideCartDrawer();

    heldOrders = readHeldOrders();
    refreshHeldOrders();

    alert("Order held successfully. No bill has been generated.");
}

/* RESUME A HELD ORDER */
function resumeHeldOrder(id) {
    heldOrders = readHeldOrders();

    if (cart.length > 0 && currentHeldOrderId !== id) {
        alert("Your current cart has items. Please hold or clear it before resuming another order.");
        return;
    }

    const order = heldOrders.find(item => item.id === id);

    if (!order) {
        alert("Held order not found.");
        refreshHeldOrders();
        return;
    }

    cart = (order.items || []).map(item => ({ ...item }));
    currentHeldOrderId = order.id;

    document.getElementById("customerName").value = order.customerName || "";
    document.getElementById("tableNumber").value = order.tableNumber || "";
    document.getElementById("phone").value = order.phone || "";
    document.getElementById("notes").value = order.notes || "";

    selectPayment(order.payment || "Cash");

    heldOrdersPanelOpen = false;
    document.getElementById("heldOrdersPanel").hidden = true;

    renderCart();

    if (cart.length) {
        showCartDrawer();
    }

    refreshHeldOrders();
}

/* DELETE A HELD ORDER */
function deleteHeldOrder(id) {
    if (id === currentHeldOrderId) {
        alert("This order is currently active. Clear the cart first if you want to delete it.");
        return;
    }

    if (!confirm("Delete this held order permanently?")) return;

    const previousOrders = readHeldOrders();
    heldOrders = previousOrders.filter(order => order.id !== id);

    if (!saveHeldOrders()) {
        heldOrders = previousOrders;
        return;
    }

    heldOrders = readHeldOrders();
    refreshHeldOrders();
}

/* NEXT ORDER NUMBER */
async function getNextOrderNumber() {
    const { data, error } = await supabaseClient
        .from("chaat_orders")
        .select("order_number")
        .order("order_number", { ascending: false })
        .limit(1)
        .maybeSingle();

    if (error) {
        console.error(error);
        throw new Error("Could not get the next order number: " + error.message);
    }

    if (!data || data.order_number == null) return 1;
    return Number(data.order_number) + 1;
}

/* BILL AND PRINT */
async function billAndPrint() {
    if (!cart.length) {
        alert("Please add items to the order.");
        return;
    }

    const customerName = document.getElementById("customerName").value.trim();
    const tableNumber = document.getElementById("tableNumber").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const notes = document.getElementById("notes").value.trim();
    const total = getTotal();

    const billButton = document.querySelector(".bill");
    billButton.disabled = true;
    billButton.textContent = "SAVING...";

    try {
        const orderNumber = await getNextOrderNumber();

        const orderItems = cart.map(item => ({
            id: item.id,
            name: item.name,
            category: item.category,
            price: item.price,
            qty: item.qty,
            subtotal: item.price * item.qty
        }));

        const { data, error } = await supabaseClient
            .from("chaat_orders")
            .insert([{
                order_number: orderNumber,
                customer_name: customerName || "Walk-in Customer",
                table_number: tableNumber || "",
                items: orderItems,
                total: total,
                payment_method: selectedPayment,
                status: "Pending"
            }])
            .select()
            .single();

        if (error) {
            console.error(error);
            alert("Order could not be saved.\n\n" + error.message);
            return;
        }

        currentOrderNumber = data.order_number;

        /* Remove the held record only after Supabase confirms the bill saved */
        if (currentHeldOrderId !== null) {
            const billedHeldId = currentHeldOrderId;
            const previousOrders = readHeldOrders();

            heldOrders = previousOrders.filter(order => order.id !== billedHeldId);

            if (saveHeldOrders()) {
                currentHeldOrderId = null;
                heldOrders = readHeldOrders();
                refreshHeldOrders();
            } else {
                heldOrders = previousOrders;
                alert("The bill was saved, but this held order remains in browser storage. Do not bill it again; remove it from the held list manually.");
                currentHeldOrderId = null;
            }
        }

        prepareReceipt({
            orderNumber: data.order_number,
            customerName: customerName || "Walk-in Customer",
            tableNumber: tableNumber || "-",
            phone: phone,
            total: total,
            payment: selectedPayment,
            notes: notes,
            items: orderItems
        });

        setTimeout(() => window.print(), 300);
        clearCart(false);

    } catch (error) {
        console.error(error);
        alert("Something went wrong.\n\n" + error.message);
    } finally {
        billButton.disabled = false;
        billButton.textContent = "BILL & PRINT";
    }
}

/* RECEIPT */
function prepareReceipt(order) {
    document.getElementById("receiptOrder").textContent = order.orderNumber;
    document.getElementById("receiptDate").textContent = new Date().toLocaleString();
    document.getElementById("receiptCustomer").textContent = order.customerName;
    document.getElementById("receiptTable").textContent = order.tableNumber;

    const phoneRow = document.getElementById("receiptPhoneRow");

    if (order.phone) {
        phoneRow.style.display = "block";
        document.getElementById("receiptPhone").textContent = order.phone;
    } else {
        phoneRow.style.display = "none";
    }

    const receiptItems = document.getElementById("receiptItems");

    receiptItems.innerHTML = order.items.map(item => {
        const price = Number(item.price || 0);
        const qty = Number(item.qty || 0);
        const subtotal = price * qty;

        return `
            <div style="display:block;margin:5px 0;line-height:1.4">
                <div style="font-weight:bold">${escapeHtml(item.name)}</div>
                <div style="display:flex;justify-content:space-between">
                    <span>₹${price.toFixed(0)} × ${qty}</span>
                    <span>= ₹${subtotal.toFixed(0)}</span>
                </div>
            </div>`;
    }).join("");

    if (order.notes) {
        receiptItems.innerHTML += `
            <div style="margin-top:8px">
                <strong>Note:</strong> ${escapeHtml(order.notes)}
            </div>`;
    }

    document.getElementById("receiptTotal").textContent =
        Number(order.total).toFixed(0);

    document.getElementById("receiptPayment").textContent = order.payment;
}

/* CLEAR CART */
function resetCustomerFields() {
    document.getElementById("customerName").value = "";
    document.getElementById("tableNumber").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("notes").value = "";
    selectPayment("Cash");
}

function clearCart(askConfirmation = true) {
    if (!cart.length) return;

    if (askConfirmation && !confirm("Clear the current order?")) return;

    cart = [];

    /* Do not delete the held record when clearing a resumed order */
    currentHeldOrderId = null;

    renderCart();
    resetCustomerFields();
}

/* STARTUP */
document.addEventListener("DOMContentLoaded", function() {
    selectPayment("Cash");
    heldOrders = readHeldOrders();
    refreshHeldOrders();
    loadProducts();
    subscribeToProductUpdates();
    renderCart();
});
</script>
