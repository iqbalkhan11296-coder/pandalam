document.addEventListener('keydown', function(e){
  const h = document.querySelector('.cart-drawer-head');
  if(h && document.activeElement === h && (e.key === 'Enter' || e.key === ' ')){
    e.preventDefault();
    toggleCartDrawer();
  }
});
</script>

<script>
function showCartBarOnly(){
  const drawer = document.getElementById('cartDrawer');
  if(drawer){
    drawer.classList.add('cart-visible');
    drawer.classList.remove('expanded');
    cartDrawerExpanded = false;
  }
}

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;

    font-family:Arial,sans-serif;

}

header{

.categories{

}

.cart{
    position:fixed;
    left:50%;
    bottom:14px;
    transform:translate(-50%,calc(100% + 30px));
    width:min(680px,calc(100% - 24px));
    max-height:min(78vh,680px);
    overflow:hidden;
    z-index:1000;
    background:rgba(248,244,234,.97);
    color:#222;
    border-radius:22px;
    padding:0;
    margin:0;
    border:1px solid rgba(245,210,122,.65);
    box-shadow:0 18px 60px rgba(0,0,0,.48),0 0 35px rgba(245,210,122,.10);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    opacity:0;
    transition:transform .52s cubic-bezier(.16,1.25,.3,1),opacity .25s ease,box-shadow .3s ease;
}
.cart.cart-visible{
    transform:translate(-50%,0);
    opacity:1;
}
.cart.cart-pulse{
    animation:cartPulse .55s cubic-bezier(.2,.9,.2,1);
}
@keyframes cartPulse{
    0%{box-shadow:0 18px 60px rgba(0,0,0,.48),0 0 0 rgba(245,210,122,0)}
    45%{box-shadow:0 18px 70px rgba(0,0,0,.5),0 0 42px rgba(245,210,122,.42)}
    100%{box-shadow:0 18px 60px rgba(0,0,0,.48),0 0 35px rgba(245,210,122,.10)}
}
.cart h2{
    margin:0;
    color:#4b001f;
    font-family:Georgia,serif;
}
.cart-drawer-head{
    min-height:72px;
    padding:12px 14px;

    gap:12px;

    background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(246,237,211,.98));

}
.cart-icon{
    width:46px;height:46px;flex:0 0 46px;

.cart-head-info{min-width:0;flex:1}
.cart-head-title{display:flex;align-items:center;gap:8px;font-weight:900;color:#4b001f;font-size:15px}
.cart-count{

    border-radius:99px;background:#f5d27a;color:#4b001f;font-size:13px;font-weight:900;
}
.cart-preview{
    margin-top:3px;color:#786a55;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cart-head-total{text-align:right;color:#4b001f;font-size:19px;font-weight:900;white-space:nowrap}
.cart-chevron{color:#4b001f;font-size:18px;transition:transform .3s ease}
.cart.expanded .cart-chevron{transform:rotate(180deg)}
.cart-body{max-height:0;overflow-y:auto;overflow-x:hidden;transition:max-height .45s cubic-bezier(.2,.8,.2,1)}
.cart.expanded .cart-body{max-height:calc(min(78vh,680px) - 72px)}

.cart-item{

}
@keyframes itemRise{
    from{opacity:0;transform:translateY(12px) scale(.97)}

}

.cart .customer{margin-top:10px;padding-top:4px}

<script>

let allProducts = [];

let currentCategory = "Chaat";

let cart = [];

let selectedPayment = "Cash";

let currentOrderNumber = null;


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

    const productsBox =
        document.getElementById("products");

    productsBox.innerHTML =
        `<div class="empty">
            Loading products...
        </div>`;

    const { data, error } =
        await supabaseClient
        .from("chaat_products")
        .select("*")
        .order("name", { ascending:true });

    if(error){

        console.error(error);

        productsBox.innerHTML = `
            <div class="empty">
                Unable to load products.<br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

        return;
    }

    allProducts = data || [];

    showCategory(
        currentCategory,
        document.querySelector(".category-btn.active")
    );
}


/* =========================
   REALTIME PRODUCT UPDATES
   ========================= */

function subscribeToProductUpdates(){

    supabaseClient
        .channel("chaat-products-live")
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "chaat_products"
            },
            payload => {

                console.log("Product update received:", payload);

                loadProducts();

            }
        )
        .subscribe(status => {

            console.log("Product realtime status:", status);

        });
}


/* =========================
   CATEGORY
========================= */

function showCategory(category, button){

    currentCategory = category;

    document
        .querySelectorAll(".category-btn")
        .forEach(btn => {

            btn.classList.remove("active");

        });

    if(button){
        button.classList.add("active");
    }

    const productsBox =
        document.getElementById("products");

    const products =
        allProducts.filter(product => {

            return String(product.category)
                .toLowerCase()
                === category.toLowerCase();

        });


    if(products.length === 0){

        productsBox.innerHTML = `
            <div class="empty">
                No products in ${escapeHtml(category)}.
            </div>
        `;

        return;
    }


    productsBox.innerHTML =
        products.map(product => {

            const available = product.available !== false;

            return `

                <div class="product ${available ? "" : "unavailable"}">

                    <div class="product-name">
                        ${escapeHtml(product.name)}
                    </div>

                    ${
                        available
                        ? ""
                        : `<div class="unavailable-badge">UNAVAILABLE</div>`
                    }

                    <div class="product-price">
                        ₹${Number(product.price).toFixed(0)}
                    </div>

                    ${
                        available
                        ? `
                            <button
                                class="add-btn"
                                onclick="addToCart(${Number(product.id)})">
                                ADD
                            </button>
                        `
                        : `
                            <button
                                class="add-btn"
                                disabled
                                style="background:#555;color:#ddd;cursor:not-allowed;">
                                UNAVAILABLE
                            </button>
                        `
                    }

                </div>

            `;

        }).join("");
}


/* =========================
   FLOATING CART DRAWER
========================= */

let cartDrawerExpanded = false;

function toggleCartDrawer(force){
    const drawer = document.getElementById("cartDrawer");
    if(!drawer || cart.length === 0) return;

    cartDrawerExpanded = typeof force === "boolean"
        ? force
        : !cartDrawerExpanded;

    drawer.classList.toggle("expanded", cartDrawerExpanded);
}

function showCartDrawer(){
    const drawer = document.getElementById("cartDrawer");
    if(!drawer) return;

    drawer.classList.add("cart-visible");
    drawer.classList.add("cart-pulse");
    cartDrawerExpanded = true;
    drawer.classList.add("expanded");

    clearTimeout(window.cartPulseTimer);
    window.cartPulseTimer = setTimeout(() => {
        drawer.classList.remove("cart-pulse");
    }, 600);
}

function hideCartDrawer(){
    const drawer = document.getElementById("cartDrawer");
    if(!drawer) return;
    cartDrawerExpanded = false;
    drawer.classList.remove("expanded");
    drawer.classList.remove("cart-visible");
}

function updateCartHeader(){
    const count = cart.reduce((sum,item) => sum + item.qty, 0);
    const total = getTotal();

    const countEl = document.getElementById("cartCount");
    const totalEl = document.getElementById("cartHeadTotal");
    const previewEl = document.getElementById("cartPreview");

    if(countEl) countEl.textContent = count;
    if(totalEl) totalEl.textContent = "₹" + total.toFixed(0);

    if(previewEl){
        if(cart.length === 0){
            previewEl.textContent = "Add items to start an order";
        }else{
            previewEl.textContent = cart.map(item =>
                item.qty > 1 ? `${item.name} ×${item.qty}` : item.name
            ).join("  •  ");
        }
    }
}

/* =========================
   ADD TO CART
========================= */

function addToCart(productId){

    const product =
        allProducts.find(
            p => Number(p.id) === Number(productId)
        );

    if(!product){
        return;
    }

    if(product.available === false){
        alert("This item is currently unavailable.");
        return;
    }


    const existing =
        cart.find(
            item => Number(item.id)
            === Number(product.id)
        );


    if(existing){

        existing.qty++;

    }else{

        cart.push({

            id: product.id,

            name: product.name,

            price: Number(product.price),

            category: product.category,

            qty: 1

        });

    }


    renderCart();
    showCartBarOnly();
}


/* =========================
   RENDER CART
========================= */

function renderCart(){

    const cartBox =
        document.getElementById("cartItems");

    if(cart.length === 0){

        cartBox.innerHTML = `
            <div class="empty">
                Cart is empty
            </div>
        `;

        document.getElementById("total")
            .textContent = "₹0";

        updateCartHeader();
        hideCartDrawer();
        return;
    }


    cartBox.innerHTML =
        cart.map((item,index) => {

            const itemTotal =
                item.price * item.qty;

            return `

                <div class="cart-item">

                    <div>

                        <strong>
                            ${escapeHtml(item.name)}
                        </strong>

                        <br>

                        ₹${item.price.toFixed(0)}
                        × ${item.qty}

                        <br>

                        <strong>
                            ₹${itemTotal.toFixed(0)}
                        </strong>

                    </div>


                    <div class="qty">

                        <button
                            onclick="changeQty(
                                ${index},-1
                            )">

                            −

                        </button>

                        <span>
                            ${item.qty}
                        </span>

                        <button
                            onclick="changeQty(
                                ${index},1
                            )">

                            +

                        </button>

                        <button
                            class="remove"
                            onclick="removeItem(
                                ${index}
                            )">

                            ×

                        </button>

                    </div>

                </div>

            `;

        }).join("");

    updateCartHeader();
    updateTotal();
}


/* =========================
   CHANGE QUANTITY
========================= */

function changeQty(index, change){

    if(!cart[index]){
        return;
    }

    cart[index].qty += change;


    if(cart[index].qty <= 0){

        cart.splice(index,1);

    }


    renderCart();
    if(cart.length > 0) showCartBarOnly();
}


/* =========================
   REMOVE ITEM
========================= */

function removeItem(index){

    cart.splice(index,1);

    renderCart();
    if(cart.length > 0) showCartBarOnly();
}


/* =========================
   TOTAL
========================= */

function getTotal(){

    return cart.reduce(
        (sum,item) =>
            sum + (item.price * item.qty),
        0
    );

}


function updateTotal(){

    const total =
        getTotal();

    document.getElementById("total")
        .textContent =
        "₹" + total.toFixed(0);

}


/* =========================
   PAYMENT
========================= */

function selectPayment(method){

    selectedPayment = method;


    document
        .querySelectorAll(".payment button")
        .forEach(button => {

            button.classList.remove("selected");

        });


    if(method === "Cash"){

        document
            .getElementById("cashBtn")
            .classList.add("selected");

    }

    if(method === "UPI"){

        document
            .getElementById("upiBtn")
            .classList.add("selected");

    }

    if(method === "Card"){

        document
            .getElementById("cardBtn")
            .classList.add("selected");

    }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
    /* =========================
   GET NEXT ORDER NUMBER
========================= */

async function getNextOrderNumber(){

    const { data, error } =
        await supabaseClient
        .from("chaat_orders")
        .select("order_number")
        .order("order_number", {
            ascending:false
        })
        .limit(1)
        .maybeSingle();


    if(error){

        console.error(error);

        return 1;
    }


    if(!data || data.order_number == null){

        return 1;
    }


    return Number(data.order_number) + 1;
}


/* =========================
   BILL & PRINT
========================= */

async function billAndPrint(){

    if(cart.length === 0){

        alert("Please add items to the order.");

        return;
    }


    const customerName =
        document
        .getElementById("customerName")
        .value
        .trim();


    const tableNumber =
        document
        .getElementById("tableNumber")
        .value
        .trim();


    const phone =
        document
        .getElementById("phone")
        .value
        .trim();


    const notes =
        document
        .getElementById("notes")
        .value
        .trim();


    const total =
        getTotal();


    const billButton =
        document.querySelector(".bill");


    billButton.disabled = true;

    billButton.textContent =
        "SAVING...";


    try{

        const orderNumber =
            await getNextOrderNumber();


        const orderItems =
            cart.map(item => ({

                id: item.id,

                name: item.name,

                category: item.category,

                price: item.price,

                qty: item.qty,

                subtotal:
                    item.price * item.qty

            }));


        const { data, error } =
            await supabaseClient
            .from("chaat_orders")
            .insert([{

                order_number:
                    orderNumber,

                customer_name:
                    customerName
                    || "Walk-in Customer",

                table_number:
                    tableNumber || "",

                items:
                    orderItems,

                total:
                    total,

                payment_method:
                    selectedPayment,

                status:
                    "Pending"

            }])
            .select()
            .single();


        if(error){

            console.error(error);

            alert(
                "Order could not be saved.\n\n"
                + error.message
            );

            return;
        }


        currentOrderNumber =
            data.order_number;


        prepareReceipt({

            orderNumber:
                data.order_number,

            customerName:
                customerName
                || "Walk-in Customer",

            tableNumber:
                tableNumber || "-",

            phone:
                phone,

            total:
                total,

            payment:
                selectedPayment,

            notes:
                notes,

            items:
                orderItems

        });


        setTimeout(() => {

            window.print();

        },300);


        clearCart(false);

    }

    catch(error){

        console.error(error);

        alert(
            "Something went wrong.\n\n"
            + error.message
        );

    }

    finally{

        billButton.disabled = false;

        billButton.textContent =
            "BILL & PRINT";

    }

}


/* =========================
   PREPARE RECEIPT
========================= */

function prepareReceipt(order){

    document.getElementById(
        "receiptOrder"
    ).textContent =
        order.orderNumber;


    const now =
        new Date();


    document.getElementById(
        "receiptDate"
    ).textContent =
        now.toLocaleString();


    document.getElementById(
        "receiptCustomer"
    ).textContent =
        order.customerName;


    document.getElementById(
        "receiptTable"
    ).textContent =
        order.tableNumber;


    const phoneRow =
        document.getElementById(
            "receiptPhoneRow"
        );


    if(order.phone){

        phoneRow.style.display =
            "block";

        document.getElementById(
            "receiptPhone"
        ).textContent =
            order.phone;

    }else{

        phoneRow.style.display =
            "none";

    }


    const receiptItems =
        document.getElementById(
            "receiptItems"
        );


    receiptItems.innerHTML =
    order.items.map(item => {

        const price =
            Number(item.price || 0);

        const qty =
            Number(item.qty || 0);

        const subtotal =
            price * qty;

        return `

            <div
                style="
                    display:block;
                    margin:5px 0;
                    line-height:1.4;
                "
            >

                <div style="font-weight:bold;">
                    ${escapeHtml(item.name)}
                </div>

                <div style="
                    display:flex;
                    justify-content:space-between;
                ">

                    <span>
                        ₹${price.toFixed(0)}
                        × ${qty}
                    </span>

                    <span>
                        = ₹${subtotal.toFixed(0)}
                    </span>

                </div>

            </div>

        `;

    }).join("");

    document.getElementById(
        "receiptTotal"
    ).textContent =
        Number(order.total).toFixed(0);


    document.getElementById(
        "receiptPayment"
    ).textContent =
        order.payment;


    if(order.notes){

        receiptItems.innerHTML += `

            <div style="margin-top:8px;">

                <strong>
                    Note:
                </strong>

                ${escapeHtml(order.notes)}

            </div>

        `;

    }

}


/* =========================
   CLEAR CART
========================= */

function clearCart(askConfirmation = true){

    if(cart.length === 0){

        return;
    }


    if(
        askConfirmation
        &&
        !confirm(
            "Clear the current order?"
        )
    ){

        return;
    }


    cart = [];

    renderCart();


    document.getElementById(
        "customerName"
    ).value = "";


    document.getElementById(
        "tableNumber"
    ).value = "";


    document.getElementById(
        "phone"
    ).value = "";


    document.getElementById(
        "notes"
    ).value = "";


    selectPayment("Cash");

}


/* =========================
   STARTUP
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        selectPayment("Cash");

        loadProducts();

        subscribeToProductUpdates();

        renderCart();

    }
);

</script>
